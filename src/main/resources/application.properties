spring.application.name=cliente-service

server.port=8083

# Banco de dados
spring.datasource.url=jdbc:h2:mem:clientedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=user
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console-pedido

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#URL dos microsserbivo
app.catologo-service.url=htpp://localhost:8081
app.cliente-service.url=htpp://localhost:8082

#Exibir mensagem de erro na resposta
spring.web.error.include-messsage=always

# Logging
logging.level.root=INFO
logging.level.br.com.fiap=DEBUG
